name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Build standalone pyz
        run: ./scripts/build-pyz.sh

      - name: Copy one-line installer
        run: cp install.sh dist/install.sh

      - name: Copy Windows installer
        run: cp install.ps1 dist/install.ps1

      - name: Build deb package
        uses: goreleaser/nfpm-action@v2
        with:
          config: packaging/nfpm/nfpm.yaml
          packager: deb
          target: dist/

      - name: Build rpm package
        uses: goreleaser/nfpm-action@v2
        with:
          config: packaging/nfpm/nfpm.yaml
          packager: rpm
          target: dist/

      - name: Build apk package
        uses: goreleaser/nfpm-action@v2
        with:
          config: packaging/nfpm/nfpm.yaml
          packager: apk
          target: dist/

      - name: Build Arch package
        uses: goreleaser/nfpm-action@v2
        with:
          config: packaging/nfpm/nfpm.yaml
          packager: archlinux
          target: dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
