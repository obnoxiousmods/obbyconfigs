name: Package Check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "packaging/**"
      - "install.sh"
      - "install.ps1"
      - "scripts/build-pyz.sh"
      - ".github/workflows/package-check.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build Python package
        run: uv build

      - name: Build standalone pyz
        run: ./scripts/build-pyz.sh

      - name: Smoke pyz
        run: ./dist/obbyinstaller.pyz --list-plan --skip-packages --skip-shell-change

      - name: Shell syntax
        run: bash -n install.sh scripts/build-pyz.sh scripts/build-release-bundles.sh

      - name: Build platform zip bundles
        run: ./scripts/build-release-bundles.sh

      - name: Set up Go for nFPM
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4

      - name: Build deb package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p deb -t dist/

      - name: Build rpm package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p rpm -t dist/

      - name: Build apk package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p apk -t dist/

      - name: Build Arch package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p archlinux -t dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: package-check-artifacts
          path: |
            dist/obbyconfigs-*.tar.gz
            dist/obbyconfigs-*.whl
            dist/obbyinstaller.pyz
            dist/obbyconfigs-*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
