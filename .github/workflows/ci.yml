name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install tmux integration dependency
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux

      - name: Sync
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Compile
        run: uv run python -m compileall obbyinstaller.py src

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Shell syntax
        run: bash -n src/obbyconfigs/templates/tmux-bin/*

      - name: ShellCheck
        run: shellcheck -x src/obbyconfigs/templates/tmux-bin/* install.sh scripts/build-pyz.sh scripts/build-release-bundles.sh

      - name: Smoke test
        run: uv run obbyinstaller --list-plan --skip-packages --skip-shell-change

  macos:
    name: macOS Bash 3 compatibility
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --all-groups --python 3.13

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests under system Bash
        run: |
          /bin/bash --version | head -1
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" uv run python -m unittest discover -s tests -v

      - name: Shell syntax under system Bash
        run: /bin/bash -n src/obbyconfigs/templates/tmux-bin/*
