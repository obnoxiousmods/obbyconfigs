# Beautiful, dependency-free Dracula tmux config.
# - Prefixes: Ctrl-a and Ctrl-b
# - Mouse: enabled
# - Status: powerline-style Dracula theme with tmux-native state indicators

##### Prefixes ################################################################

set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix

##### Core behavior ###########################################################

set-environment -g OBBY_TMUX_BIN __OBBY_TMUX_BIN__
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g window-size latest
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g display-time 2500
set -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#(#{q:OBBY_TMUX_BIN}/pane-title #{q:pane_tty} #{q;b:pane_current_path})"
set -g status-keys vi
setw -g mode-keys vi
setw -g aggressive-resize on

bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind C-r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

##### Ergonomic panes and windows ############################################

bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind V split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind C-Left select-pane -L
bind C-Down select-pane -D
bind C-Up select-pane -U
bind C-Right select-pane -R
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 3
bind -r S-Up resize-pane -U 3
bind -r S-Right resize-pane -R 5
bind -r C-S-Left resize-pane -L 5
bind -r C-S-Down resize-pane -D 3
bind -r C-S-Up resize-pane -U 3
bind -r C-S-Right resize-pane -R 5
bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 3
bind -r M-K resize-pane -U 3
bind -r M-L resize-pane -R 5
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 3
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Right resize-pane -R 5

bind m resize-pane -Z
bind z resize-pane -Z
bind Enter resize-pane -Z
bind Space next-layout
bind C-Space previous-layout
bind E select-layout even-horizontal
bind C-e select-layout even-vertical
bind C-o rotate-window
bind o select-pane -t :.+
bind s choose-tree -sZ
bind w choose-tree -wZ
bind W choose-window
bind Tab last-window
bind n next-window
bind p previous-window
bind C-n next-window
bind N previous-window
bind f command-prompt -p "find window:" "find-window -Z '%%'"
bind / command-prompt -p "find window:" "find-window -Z '%%'"
bind P command-prompt -p "rename session:" "rename-session '%%'"
bind , command-prompt -p "rename window:" "rename-window '%%'"
bind . command-prompt -p "move window to index:" "move-window -t '%%'"
bind > swap-window -t +1 \; select-window -t +1
bind < swap-window -t -1 \; select-window -t -1
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind q display-panes
bind d detach-client
bind D choose-client
bind : command-prompt

# tmux 3.2+ popup scratch shell. Harmless if you never use it.
bind C-p display-popup -E -w 88% -h 82% -d "#{pane_current_path}" "#{SHELL:-/bin/sh}"
bind C-t display-popup -E -w 88% -h 82% -d "#{pane_current_path}" "#{SHELL:-/bin/sh}"

##### Root key aliases ########################################################

# Common Linux/Windows terminal shortcuts when the terminal passes them through.
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-Tab last-window
bind -n M-Enter resize-pane -Z

##### Dracula palette #########################################################

dracula_bg="#20202d"
dracula_bar="#16161f"
dracula_current="#2b2b3c"
dracula_selection="#36364d"
dracula_fg="#e8e3f4"
dracula_muted="#817c9c"
dracula_cyan="#9aa5ce"
dracula_green="#b7bdf8"
dracula_orange="#c4a7e7"
dracula_pink="#c4a7e7"
dracula_purple="#a78bfa"
dracula_red="#e78284"
dracula_yellow="#e5c890"
prompt_os="#30303f"
prompt_identity="#30303f"
prompt_dir="#5d5f87"
prompt_vcs="#8787af"

##### Terminal and message styling ###########################################

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

set -g message-style "fg=${dracula_fg},bg=${dracula_current},bold"
set -g message-command-style "fg=${dracula_fg},bg=${dracula_current},bold"
set -g mode-style "fg=${dracula_bg},bg=${dracula_purple},bold"
set -g copy-mode-match-style "fg=${dracula_bg},bg=${dracula_yellow}"
set -g copy-mode-current-match-style "fg=${dracula_bg},bg=${dracula_orange},bold"
set -g cursor-colour "${dracula_pink}"

##### Pane styling ############################################################

set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style "fg=${dracula_muted},bg=default"
set -g pane-active-border-style "fg=${dracula_pink},bg=default"
set -g pane-border-format "#[fg=${dracula_muted}] #{?pane_active,#[fg=${dracula_pink} bold],}#P #(#{q:OBBY_TMUX_BIN}/pane-title #{q:pane_tty} #{q:pane_current_command}) #[fg=${dracula_muted}]#{b:pane_current_path} "
set -g display-panes-colour "${dracula_purple}"
set -g display-panes-active-colour "${dracula_pink}"

##### Window styling ##########################################################

setw -g window-status-separator ""
setw -g window-status-style "fg=${dracula_muted},bg=${dracula_bar},none"
setw -g window-status-activity-style "fg=${dracula_yellow},bg=${dracula_bar},bold"
setw -g window-status-bell-style "fg=${dracula_bg},bg=${dracula_red},bold"

setw -g window-status-format "#[fg=${dracula_bar},bg=${dracula_current}]#[fg=${dracula_fg},bg=${dracula_current}] #I #[fg=${dracula_muted},bg=${dracula_current}]#W#{?window_flags, #[fg=${dracula_orange}]#F,} #[fg=${dracula_current},bg=${dracula_bar}]"
setw -g window-status-current-format "#[fg=${dracula_bar},bg=${dracula_purple}]#[fg=${dracula_bg},bg=${dracula_purple},bold] #I #[fg=${dracula_bg},bg=${dracula_purple},bold]#W#{?window_zoomed_flag, #[fg=${dracula_yellow},bg=${dracula_purple}]Z,}#{?window_flags, #[fg=${dracula_bg}]#F,} #[fg=${dracula_purple},bg=${dracula_bar}]"

##### Status line #############################################################

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=${dracula_fg},bg=${dracula_bar}"
set -g status-left-length 120
set -g status-right-length 220

# Left: runtime OS icon, session, muted prefix, and git-like window/pane count.
set -g status-left "#[fg=${dracula_fg},bg=${prompt_os},bold] #(#{q:OBBY_TMUX_BIN}/os-icon) #S #[fg=${prompt_os},bg=${prompt_dir}]#[fg=${dracula_fg},bg=${prompt_dir},bold] #{?client_prefix,PREFIX,tmux} #[fg=${prompt_dir},bg=${prompt_vcs}]#[fg=${dracula_fg},bg=${prompt_vcs},bold] #I:#P #[fg=${prompt_vcs},bg=${dracula_bar}] "

# Right: conditional badges, smart command name, identity, cwd, GitHub repo/branch, time.
set -g status-right "#{?window_zoomed_flag,#[fg=${dracula_bar},bg=${dracula_yellow}]#[fg=${dracula_bg},bg=${dracula_yellow},bold] ZOOM ,}#{?pane_synchronized,#[fg=${dracula_bar},bg=${dracula_red}]#[fg=${dracula_bg},bg=${dracula_red},bold] SYNC ,}#[fg=${prompt_os},bg=${dracula_bar}]#[fg=${dracula_fg},bg=${prompt_os}] #(#{q:OBBY_TMUX_BIN}/pane-title #{q:pane_tty} #{q:pane_current_command}) #[fg=${prompt_identity},bg=${prompt_os}]#[fg=${dracula_fg},bg=${prompt_identity}] #(#{q:OBBY_TMUX_BIN}/pane-context #{q:pane_tty}) #[fg=${prompt_dir},bg=${prompt_identity}]#[fg=${dracula_fg},bg=${prompt_dir},bold] #{b:pane_current_path} #[fg=${prompt_vcs},bg=${prompt_dir}]#[fg=${dracula_fg},bg=${prompt_vcs},bold] #(#{q:OBBY_TMUX_BIN}/git-info #{q:pane_current_path}) %H:%M "

##### Copy mode ###############################################################

bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

##### Mouse refinements #######################################################

bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -n WheelDownPane select-pane -t= \; send-keys -M

##### Optional TPM hook #######################################################

if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
