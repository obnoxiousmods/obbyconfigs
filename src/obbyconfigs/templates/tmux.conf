# Beautiful, dependency-free Dracula tmux config.
# - Prefixes: Ctrl-a and Ctrl-b
# - Mouse: enabled
# - Status: powerline-style Dracula theme with tmux-native state indicators

##### Prefixes ################################################################

set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix

##### Core behavior ###########################################################

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g window-size latest
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g display-time 2500
set -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#(__OBBY_TMUX_BIN__/pane-title '#{pane_tty}' '#{b:pane_current_path}')"
set -g status-keys vi
setw -g mode-keys vi
setw -g aggressive-resize on

bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind C-r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

##### Ergonomic panes and windows ############################################

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind m resize-pane -Z
bind s choose-tree -sZ
bind w choose-tree -wZ
bind f command-prompt -p "find window:" "find-window -Z '%%'"
bind P command-prompt -p "rename session:" "rename-session '%%'"
bind , command-prompt -p "rename window:" "rename-window '%%'"
bind > swap-window -t +1 \; select-window -t +1
bind < swap-window -t -1 \; select-window -t -1

# tmux 3.2+ popup scratch shell. Harmless if you never use it.
bind C-p display-popup -E -w 88% -h 82% -d "#{pane_current_path}" "#{SHELL:-/bin/sh}"

##### Dracula palette #########################################################

dracula_bg="#20202d"
dracula_bar="#16161f"
dracula_current="#2b2b3c"
dracula_selection="#36364d"
dracula_fg="#e8e3f4"
dracula_muted="#817c9c"
dracula_cyan="#9aa5ce"
dracula_green="#b7bdf8"
dracula_orange="#c4a7e7"
dracula_pink="#c4a7e7"
dracula_purple="#a78bfa"
dracula_red="#e78284"
dracula_yellow="#e5c890"

##### Terminal and message styling ###########################################

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

set -g message-style "fg=${dracula_fg},bg=${dracula_current},bold"
set -g message-command-style "fg=${dracula_fg},bg=${dracula_current},bold"
set -g mode-style "fg=${dracula_bg},bg=${dracula_purple},bold"
set -g copy-mode-match-style "fg=${dracula_bg},bg=${dracula_yellow}"
set -g copy-mode-current-match-style "fg=${dracula_bg},bg=${dracula_orange},bold"
set -g cursor-colour "${dracula_pink}"

##### Pane styling ############################################################

set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style "fg=${dracula_muted},bg=default"
set -g pane-active-border-style "fg=${dracula_pink},bg=default"
set -g pane-border-format "#[fg=${dracula_muted}] #{?pane_active,#[fg=${dracula_pink} bold],}#P #(__OBBY_TMUX_BIN__/pane-title '#{pane_tty}' '#{pane_current_command}') #[fg=${dracula_muted}]#{b:pane_current_path} "
set -g display-panes-colour "${dracula_purple}"
set -g display-panes-active-colour "${dracula_pink}"

##### Window styling ##########################################################

setw -g window-status-separator ""
setw -g window-status-style "fg=${dracula_muted},bg=${dracula_bar},none"
setw -g window-status-activity-style "fg=${dracula_yellow},bg=${dracula_bar},bold"
setw -g window-status-bell-style "fg=${dracula_bg},bg=${dracula_red},bold"

setw -g window-status-format "#[fg=${dracula_bar},bg=${dracula_current}]#[fg=${dracula_fg},bg=${dracula_current}] #I #[fg=${dracula_muted},bg=${dracula_current}]#W#{?window_flags, #[fg=${dracula_orange}]#F,} #[fg=${dracula_current},bg=${dracula_bar}]"
setw -g window-status-current-format "#[fg=${dracula_bar},bg=${dracula_purple}]#[fg=${dracula_bg},bg=${dracula_purple},bold] #I #[fg=${dracula_bg},bg=${dracula_purple},bold]#W#{?window_zoomed_flag, #[fg=${dracula_yellow},bg=${dracula_purple}]Z,}#{?window_flags, #[fg=${dracula_bg}]#F,} #[fg=${dracula_purple},bg=${dracula_bar}]"

##### Status line #############################################################

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=${dracula_fg},bg=${dracula_bar}"
set -g status-left-length 120
set -g status-right-length 180

# Left: session, prefix state, window/pane count.
set -g status-left "#[fg=${dracula_bg},bg=${dracula_pink},bold] #S #[fg=${dracula_pink},bg=${dracula_purple}]#[fg=${dracula_bg},bg=${dracula_purple},bold] #{?client_prefix,PREFIX,tmux} #[fg=${dracula_purple},bg=${dracula_cyan}]#[fg=${dracula_bg},bg=${dracula_cyan},bold] #I:#P #[fg=${dracula_cyan},bg=${dracula_bar}] "

# Right: conditional zoom/sync badges, smart command name, identity, cwd, time.
set -g status-right "#{?window_zoomed_flag,#[fg=${dracula_bar},bg=${dracula_yellow}]#[fg=${dracula_bg},bg=${dracula_yellow},bold] ZOOM ,}#{?pane_synchronized,#[fg=${dracula_bar},bg=${dracula_red}]#[fg=${dracula_bg},bg=${dracula_red},bold] SYNC ,}#[fg=${dracula_current},bg=${dracula_bar}]#[fg=${dracula_fg},bg=${dracula_current}] #(__OBBY_TMUX_BIN__/pane-title '#{pane_tty}' '#{pane_current_command}') #[fg=${dracula_muted},bg=${dracula_current}]#[fg=${dracula_fg},bg=${dracula_muted}] #(__OBBY_TMUX_BIN__/pane-context '#{pane_tty}' '#(whoami)' '#h') #[fg=${dracula_purple},bg=${dracula_muted}]#[fg=${dracula_bg},bg=${dracula_purple},bold] #{b:pane_current_path} #[fg=${dracula_pink},bg=${dracula_purple}]#[fg=${dracula_bg},bg=${dracula_pink},bold] %H:%M "

##### Copy mode ###############################################################

bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

##### Mouse refinements #######################################################

bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -n WheelDownPane select-pane -t= \; send-keys -M

##### Optional TPM hook #######################################################

if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
