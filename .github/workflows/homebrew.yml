name: Homebrew Tap

on:
  release:
    types: ["published"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when Homebrew tap is not configured
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' || env.HOMEBREW_TAP_REPO == '' }}
        run: echo "HOMEBREW_TAP_REPO or HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap publish."

      - name: Checkout
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' && env.HOMEBREW_TAP_REPO != '' }}
        uses: actions/checkout@v6

      - name: Prepare formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' && env.HOMEBREW_TAP_REPO != '' && startsWith(github.ref_name, 'v') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/tag: \"v[^\"]*\"/tag: \"v${version}\"/" packaging/homebrew/obbyconfigs.rb

      - name: Push formula to tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' && env.HOMEBREW_TAP_REPO != '' }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          install -d tap/Formula
          cp packaging/homebrew/obbyconfigs.rb tap/Formula/obbyconfigs.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/obbyconfigs.rb
          git commit -m "Update obbyconfigs ${GITHUB_REF_NAME}" || exit 0
          git push
