name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Build standalone pyz
        run: ./scripts/build-pyz.sh

      - name: Set up Go for nFPM
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4

      - name: Copy one-line installer
        run: cp install.sh dist/install.sh

      - name: Copy Windows installer
        run: cp install.ps1 dist/install.ps1

      - name: Build platform zip bundles
        run: ./scripts/build-release-bundles.sh

      - name: Build deb package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p deb -t dist/

      - name: Build rpm package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p rpm -t dist/

      - name: Build apk package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p apk -t dist/

      - name: Build Arch package
        run: nfpm package -f packaging/nfpm/nfpm.yaml -p archlinux -t dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
