name: PyPI

on:
  release:
    types: ["published"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/obbyconfigs
    steps:
      - name: Skip when PyPI is not configured
        if: ${{ vars.ENABLE_PYPI_PUBLISH != 'true' }}
        run: echo "Set ENABLE_PYPI_PUBLISH=true after configuring PyPI trusted publishing."

      - name: Checkout
        if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
        uses: actions/checkout@v7

      - name: Install uv
        if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
        run: uv build

      - name: Publish to PyPI
        if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
