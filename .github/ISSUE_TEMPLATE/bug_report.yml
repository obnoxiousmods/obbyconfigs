name: Bug report
description: Report installer behavior that is broken or unsafe.
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      description: Include the distro and version.
      placeholder: "Ubuntu 24.04, Debian 12, Arch rolling"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command you ran.
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
