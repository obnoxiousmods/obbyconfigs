name: Feature request
description: Suggest a package, shell feature, mode, or platform improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should the installer handle better?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior or flag you want.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - user
        - system/all-users
        - package management
        - documentation
        - GitHub automation
    validations:
      required: true
